[project]
name = "ai-task-platform"
version = "0.1.0a1"
description = "Self-hosted AI image and conversation task workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0,<1", "uvicorn>=0.44.0,<1", "httpx>=0.28.1,<1",
  "python-multipart>=0.0.26,<1", "pillow>=13.0.0,<14", "python-dotenv>=1.2,<2"
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
